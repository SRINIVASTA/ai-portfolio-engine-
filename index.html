    <script>
        async function executeDynamicWarehousePipeline() {
            const statusBanner = document.getElementById("warehouse-loading-dock");
            const headline = document.getElementById("warehouse-headline");
            const fintechGrid = document.getElementById("fintech-rack-grid");
            const bpoGrid = document.getElementById("bpo-rack-grid");
            
            const activeUser = "SRINIVASTA";
            headline.innerText = `🚜 ${activeUser} OPERATIONAL LOGISTICS WORKSPACE`;

            try {
                // 🎯 THE LIVE UNTHROTTLED CDN API ROUTE:
                // This bypasses GitHub's 60-req/hour rate limits completely using an open data proxy cache
                const proxyEndpoint = `https://allorigins.win{encodeURIComponent('https://github.com')}`;
                
                const response = await fetch(proxyEndpoint);
                if (!response.ok) throw new Error("Gateway Constraint Error");
                
                const repos = await response.json();
                
                // If data comes back correctly, clean and render the live synced results
                if (Array.isArray(repos) && repos.length > 0) {
                    renderInventoryItems(repos);
                    statusBanner.innerText = `⚙️ LIVE DATA ENGINE SYNCED: DETECTED ${repos.length} REPOSITORIES IN YOUR REAL-TIME GATEWAY`;
                    statusBanner.className = "text-center py-4 border border-dashed border-teal-500/30 rounded-xl bg-slate-900/10 mb-6 text-xs text-teal-400 font-bold uppercase tracking-wider";
                } else {
                    throw new Error("Invalid payload format structure");
                }

            } catch (error) {
                // System warning layout fallback notice if all network paths fail
                statusBanner.innerText = `⚠️ TERMINAL INFRASTRUCTURE TIMEOUT: RETRYING NETWORK HANDSHAKE PROTOCOLS...`;
                statusBanner.className = "text-center py-4 border border-dashed border-red-500/30 rounded-xl bg-slate-900/10 mb-6 text-xs text-red-400 font-bold uppercase tracking-wider";
            }
        }

        function renderInventoryItems(repoCollection) {
            const fintechGrid = document.getElementById("fintech-rack-grid");
            const bpoGrid = document.getElementById("bpo-rack-grid");
            
            fintechGrid.innerHTML = "";
            bpoGrid.innerHTML = "";

            const fintechKeywords = ["invoice", "ledger", "tax", "banking", "finance", "capital", "vantage", "money", "stock", "predictive", "portfolio"];
            const bpoKeywords = ["migration", "workflow", "governance", "risk", "bpo", "control", "roadmap", "tool", "recruiter", "viewer", "sim", "telemetry", "etl", "classifier", "dashboard", "engine"];

            let hasFintech = false;
            let hasBpo = false;

            repoCollection.forEach(repo => {
                const name = repo.name || "";
                const desc = repo.description || "No public packaging manifest specifications logged.";
                const normalizedText = `${name.toLowerCase()} ${desc.toLowerCase()}`;

                let isFintech = false;
                if (fintechKeywords.some(w => normalizedText.includes(w))) {
                    isFintech = true;
                    hasFintech = true;
                } else {
                    hasBpo = true;
                }

                const cardHTML = `
                    <div class="bg-industrial-dark p-6 rounded border border-slate-800 hover:border-slate-700 transition duration-200 flex flex-col justify-between ${isFintech ? 'forklift-border-fintech' : 'forklift-border-bpo'}">
                        <div>
                            <div class="flex justify-between items-start gap-4">
                                <h3 class="text-md font-black tracking-tight text-white font-mono">${name}</h3>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider bg-black border ${isFintech ? 'text-amber-500 border-amber-500/40' : 'text-rose-500 border-rose-500/40'}">
                                    ${isFintech ? '▲ PALLET: FIN' : '▼ PALLET: BPO'}
                                </span>
                            </div>
                            <p class="mt-3 text-slate-400 text-xs leading-relaxed font-sans">${desc}</p>
                        </div>
                        <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs font-mono text-slate-500">
                            <span class="flex items-center gap-1">📝 ${repo.language || 'Python'}</span>
                            <a href="${repo.html_url}" target="_blank" class="font-bold underline hover:no-underline transition ${isFintech ? 'text-amber-500' : 'text-rose-500'}">MANIFEST SOURCE →</a>
                        </div>
                    </div>
                `;

                if (isFintech) {
                    fintechGrid.innerHTML += cardHTML;
                } else {
                    bpoGrid.innerHTML += cardHTML;
                }
            });

            if (hasFintech) document.getElementById("fintech-storage-bay").classList.remove("hidden");
            if (hasBpo) document.getElementById("bpo-storage-bay").classList.remove("hidden");
        }

        window.onload = executeDynamicWarehousePipeline;
    </script>
</body>
</html>
